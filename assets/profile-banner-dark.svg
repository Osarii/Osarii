<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">The Osarii Archive at night</title>
  <desc id="desc">A restrained dark fantasy landscape with an eclipsed moon, ruined gothic towers, mountains, fog, and Jared Prendas's developer identity.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#070708"/><stop offset=".7" stop-color="#17171c"/><stop offset="1" stop-color="#0d0d10"/>
    </linearGradient>
    <radialGradient id="halo">
      <stop stop-color="#d8d2c4" stop-opacity=".54"/><stop offset=".55" stop-color="#9da3ad" stop-opacity=".13"/><stop offset="1" stop-color="#66717c" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grain" width="23" height="19" patternUnits="userSpaceOnUse">
      <path d="M2 3h1M15 7h1M8 16h1M21 13h1" stroke="#d8d2c4" stroke-opacity=".12"/>
    </pattern>
    <clipPath id="frame"><rect x="14" y="14" width="1172" height="292" rx="2"/></clipPath>
  </defs>
  <rect width="1200" height="320" fill="url(#sky)"/>
