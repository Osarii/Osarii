    <text x="70" y="151" font-family="Georgia,'Times New Roman',serif" font-size="64" letter-spacing="9">OSARII</text>
    <path d="M73 170h435" stroke="#6e1f27" stroke-width="2"/><path d="M74 177h294" stroke="#55545b"/>
    <text x="74" y="207" font-family="Georgia,'Times New Roman',serif" font-size="21" letter-spacing="4">JARED PRENDAS</text>
    <text x="74" y="235" font-family="Consolas,Monaco,'Courier New',monospace" font-size="14" letter-spacing="2" fill="#9da3ad">FULL-STACK DEVELOPER · COSTA RICA</text>
