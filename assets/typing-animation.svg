    <clipPath id="type2"><rect x="220" y="25" width="0" height="30"><animate attributeName="width" values="0;0;650;650;0;0" keyTimes="0;.25;.45;.48;.5;1" dur="16s" repeatCount="indefinite"/></rect></clipPath>
    <clipPath id="type3"><rect x="220" y="25" width="0" height="30"><animate attributeName="width" values="0;0;650;650;0;0" keyTimes="0;.5;.7;.73;.75;1" dur="16s" repeatCount="indefinite"/></rect></clipPath>
    <clipPath id="type4"><rect x="220" y="25" width="0" height="30"><animate attributeName="width" values="0;0;650;650;0" keyTimes="0;.75;.95;.98;1" dur="16s" repeatCount="indefinite"/></rect></clipPath>
