<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="1200" height="380" role="img" aria-labelledby="t d">
  <title id="t">Osarii — Full-Stack Developer and AI workflow engineer</title>
  <desc id="d">Animated header: name, rotating roles and a network of nodes with flowing connections.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070a12"/>
      <stop offset="1" stop-color="#0d1222"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5eead4"/>
      <stop offset="0.5" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#f472b6"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.45" r="0.45">
      <stop offset="0" stop-color="#818cf8" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#818cf8" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#1c2540" stroke-width="1"/>
    </pattern>
    <clipPath id="frame"><rect width="1200" height="380" rx="18"/></clipPath>
  </defs>
  <style>
    .grid { animation: drift 18s linear infinite; }
    @keyframes drift { to { transform: translate(-40px, -40px); } }
    .glow { animation: breathe 7s ease-in-out infinite; transform-origin: 940px 170px; }
    @keyframes breathe { 50% { opacity: .55; transform: scale(1.08); } }
    .name { font: 800 92px 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; letter-spacing: 1px; fill: #f8fafc; opacity: 0; animation: rise .9s cubic-bezier(.2,.8,.2,1) .2s forwards; }
    .handle { font: 500 20px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #94a3b8; opacity: 0; animation: rise .9s cubic-bezier(.2,.8,.2,1) .45s forwards; }
    @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
    .bar { transform-origin: 72px 0; transform: scaleX(0); animation: grow 1.1s cubic-bezier(.2,.8,.2,1) .6s forwards; }
    @keyframes grow { to { transform: scaleX(1); } }
    .role { font: 600 26px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: url(#accent); opacity: 0; animation: cycle 16s infinite; }
    .r2 { animation-delay: 4s; } .r3 { animation-delay: 8s; } .r4 { animation-delay: 12s; }
    @keyframes cycle { 0% { opacity: 0; transform: translateY(10px); } 3%, 22% { opacity: 1; transform: none; } 25%, 100% { opacity: 0; transform: translateY(-10px); } }
    .caret { fill: #5eead4; animation: blink 1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    .meta { font: 500 15px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #64748b; letter-spacing: 2px; }
    .edge { stroke: #334155; stroke-width: 1.5; fill: none; }
    .flow { stroke: url(#accent); stroke-width: 2.4; fill: none; stroke-linecap: round; stroke-dasharray: 10 150; animation: flow 3.2s linear infinite; }
    .f2 { animation-delay: -.8s; } .f3 { animation-delay: -1.6s; } .f4 { animation-delay: -2.4s; } .f5 { animation-delay: -1.2s; } .f6 { animation-delay: -2s; }
    @keyframes flow { to { stroke-dashoffset: -160; } }
    .node { fill: #0f172a; stroke: #475569; stroke-width: 1.5; }
    .hub { fill: #111827; stroke: url(#accent); stroke-width: 2.5; }
    .pulse { fill: none; stroke: #818cf8; stroke-width: 2; transform-box: fill-box; transform-origin: center; animation: pulse 2.8s ease-out infinite; }
    .p2 { animation-delay: .9s; } .p3 { animation-delay: 1.8s; }
    @keyframes pulse { from { opacity: .8; transform: scale(1); } to { opacity: 0; transform: scale(2.4); } }
    .label { font: 600 12px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #94a3b8; letter-spacing: 1px; }
    .hublabel { font: 700 13px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #e2e8f0; letter-spacing: 1px; }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } .name, .handle, .r1 { opacity: 1; } .bar { transform: none; } .flow { stroke-dasharray: none; opacity: .5; } }
  </style>

  <g clip-path="url(#frame)">
    <rect width="1200" height="380" fill="url(#bg)"/>
    <rect class="grid" x="0" y="0" width="1280" height="460" fill="url(#grid)" opacity=".6"/>
    <rect class="glow" width="1200" height="380" fill="url(#glow)"/>

    <!-- Identity -->
    <text class="handle" x="72" y="92">~/osarii $ whoami</text>
    <text class="name" x="66" y="176">OSARII</text>
    <rect class="bar" x="72" y="196" width="330" height="4" rx="2" fill="url(#accent)"/>
    <g transform="translate(98 246)">
      <text class="role r1">Full-Stack Developer</text>
      <text class="role r2">AI Agent Workflows</text>
      <text class="role r3">Automation &amp; Integrations</text>
      <text class="role r4">From the field to the code</text>
    </g>
    <rect class="caret" x="72" y="224" width="12" height="28" rx="2"/>
    <text class="meta" x="72" y="322">COSTA RICA · COMPUTER ENGINEERING · REACT · TYPESCRIPT · NODE</text>

    <!-- Orchestration graph -->
    <g transform="translate(940 175)">
      <path class="edge" d="M0 0 L-150 -95"/><path class="edge" d="M0 0 L150 -95"/>
      <path class="edge" d="M0 0 L-175 40"/><path class="edge" d="M0 0 L175 40"/>
      <path class="edge" d="M0 0 L-80 135"/><path class="edge" d="M0 0 L95 135"/>
      <path class="flow" d="M-150 -95 L0 0"/><path class="flow f2" d="M0 0 L150 -95"/>
      <path class="flow f3" d="M-175 40 L0 0"/><path class="flow f4" d="M0 0 L175 40"/>
      <path class="flow f5" d="M0 0 L-80 135"/><path class="flow f6" d="M95 135 L0 0"/>

      <circle class="pulse" r="34"/><circle class="pulse p2" r="34"/><circle class="pulse p3" r="34"/>
      <circle class="hub" r="34"/>
      <text class="hublabel" text-anchor="middle" y="5">ORCH</text>

      <g><circle class="node" cx="-150" cy="-95" r="22"/><text class="label" x="-150" y="-128" text-anchor="middle">PLAN</text></g>
      <g><circle class="node" cx="150" cy="-95" r="22"/><text class="label" x="150" y="-128" text-anchor="middle">BUILD</text></g>
      <g><circle class="node" cx="-175" cy="40" r="22"/><text class="label" x="-175" y="83" text-anchor="middle">DATA</text></g>
      <g><circle class="node" cx="175" cy="40" r="22"/><text class="label" x="175" y="83" text-anchor="middle">TEST</text></g>
      <g><circle class="node" cx="-80" cy="135" r="22"/><text class="label" x="-80" y="178" text-anchor="middle">AUTOMATE</text></g>
      <g><circle class="node" cx="95" cy="135" r="22"/><text class="label" x="95" y="178" text-anchor="middle">SHIP</text></g>
    </g>
  </g>
</svg>
